<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <script src="main.js" defer></script>
    <title>Weather App</title>
</head>
<body>
    <div id="main">
        <div id="title">
            <h1>Weather <span class="now">N&#9788;W</span></h1>
        </div>
        <div id="searchBox">
            <input type="text" placeholder="Enter your city" id="search">
            <button class="btn"> 
      <label for="search"></label>
      <div class="search-icon"></div>
    </button>
        </div>
        <div class="widget">
  <div class="weatherIcon"><img src="/assets/weather-app.png" height="150"></div>
  <div class="weatherInfo">
    <div class="temperature">25&deg;</div>
    <div class="description">    
      <div class="weatherCondition">CLOUDY</div>    
      <div class="place">New York, New York</div>
    </div>
  </div>
  <div class="showDate">1st Jan</div>
</div>
    </div>
</body>
</html>
